<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innskráning — Litljómi Hub (reference mockup)</title>
<!-- Reference mockup for the UI level-up brief. Static, inline-styled, not production code. Google Fonts are used here only for viewing; the CMS self-hosts its fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#4d6c37;text-underline-offset:4px}a:hover{color:#171714}
</style>
</head>
<body>
<div style="min-height: 900px; box-sizing: border-box; padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; background: #ffffff; color: #171714; font-family: 'Albert Sans', Arial, sans-serif;">

  <main style="flex: 1 1 520px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 5vw, 80px); display: flex; flex-direction: column; justify-content: space-between; gap: 48px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg viewBox="0 -700 1234.2 740" width="40" height="24" aria-hidden="true"><path d="M791.9 -654.5C689.4 -654.5 595.2 -598.1 546.7 -507.8C512.4 -533.7 470.6 -547.7 427.6 -547.8C318.2 -547.8 229.5 -459.1 229.5 -349.7C229.6 -347.7 229.7 -345.6 229.8 -343.5C224.8 -344.0 219.9 -344.2 214.9 -344.3C121.3 -344.3 45.5 -268.4 45.5 -174.9C45.5 -81.3 121.3 -5.5 214.9 -5.5H1019.3C1112.8 -5.5 1188.7 -81.3 1188.7 -174.9C1188.6 -249.8 1139.3 -315.9 1067.4 -337.2C1069.3 -350.0 1070.4 -363.0 1070.5 -376.0C1070.5 -529.8 945.8 -654.5 791.9 -654.5Z" fill="none" stroke="#171714" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.6px;">Litljómi</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; background: #8ed462; color: #171714; border-radius: 4px; padding: 5px 8px;">Hub</span>
    </div>

    <form style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2.1px; text-transform: uppercase; color: #66685f;">Vefstjórn</span>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 440; font-size: 48px; line-height: 1.1; letter-spacing: -0.48px;">Skráðu þig inn.</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.45; color: #66685f;">Við sendum þér tengil í tölvupósti. Ekkert lykilorð til að muna.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="email-a" style="font-size: 16px; font-weight: 500;">Netfang</label>
        <input id="email-a" type="email" placeholder="nafn@fyrirtaeki.is" style="height: 56px; box-sizing: border-box; padding: 0 18px; border: 1px solid #66685f; border-radius: 8px; background: #ffffff; font-family: 'Albert Sans', Arial, sans-serif; font-size: 18px; color: #171714;">
      </div>
      <button type="submit" style="height: 60px; border: 0; border-radius: 8px; background: #8ed462; color: #171714; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2.1px; text-transform: uppercase; cursor: pointer;">Senda innskráningartengil</button>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #66685f;">Ekki með aðgang? <a href="mailto:hello@litljomi.is">Hafðu samband við Litljómi</a></p>
    </form>

    <p style="margin: 0; font-size: 14px; color: #66685f;">Litljómi ehf. · Reykjavík</p>
  </main>

  <aside style="flex: 1 1 480px; min-width: 0; min-height: 420px; box-sizing: border-box; padding: clamp(32px, 5vw, 72px); border-radius: 32px; background: #171714; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; overflow: hidden;">
    <svg viewBox="0 -700 1234.2 740" width="100%" style="max-width: 420px; align-self: flex-end;" aria-hidden="true"><path d="M791.9 -654.5C689.4 -654.5 595.2 -598.1 546.7 -507.8C512.4 -533.7 470.6 -547.7 427.6 -547.8C318.2 -547.8 229.5 -459.1 229.5 -349.7C229.6 -347.7 229.7 -345.6 229.8 -343.5C224.8 -344.0 219.9 -344.2 214.9 -344.3C121.3 -344.3 45.5 -268.4 45.5 -174.9C45.5 -81.3 121.3 -5.5 214.9 -5.5H1019.3C1112.8 -5.5 1188.7 -81.3 1188.7 -174.9C1188.6 -249.8 1139.3 -315.9 1067.4 -337.2C1069.3 -350.0 1070.4 -363.0 1070.5 -376.0C1070.5 -529.8 945.8 -654.5 791.9 -654.5Z" fill="none" stroke="#8ed462" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 440; font-size: clamp(36px, 4.4vw, 68px); line-height: 1.1; letter-spacing: -0.68px;">Vefurinn þinn, í þínum höndum.</h2>
      <p style="margin: 0; max-width: 460px; font-size: 18px; line-height: 1.45; color: rgba(255, 255, 255, 0.7);">Breyttu opnunartímum, vörum og myndum sjálf. Við sjáum um restina.</p>
    </div>
  </aside>
</div>
</body>
</html>
